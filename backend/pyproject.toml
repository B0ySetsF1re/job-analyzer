[project]
name = "job-analyzer"
version = "0.1.0"
description = "Turns unstructured job postings into structured, typed data."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.161.1",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.1",
    "pydantic[email]>=2.14.1",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "typer>=0.29.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes (unused imports/vars, undefined names)
    "I",       # isort (import ordering)
    "UP",      # pyupgrade (modern syntax: list[int], X | None, ...)
    "B",       # bugbear (common footguns, e.g. mutable default args)
    "SIM",     # simplify
    "ASYNC",   # blocking calls inside async functions
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # makes `import app` work without packaging the project

[tool.alembic]
script_location = "%(here)s/migrations"
# Date-prefixed file names, so migrations sort chronologically in the file tree.
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"
prepend_sys_path = ["."]

# Format + lint every generated migration with ruff. Format first: it wraps the long
# lines autogenerate writes, so the check only reports real issues.
[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_check"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"
